<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>婚宴座位即時同步系統 | 即時資料庫版</title>
    
    <!-- Google 字體 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- React & Babel -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Firebase SDKs (支援 Realtime Database) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-database-compat.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['"Noto Sans TC"', 'sans-serif'] },
                    colors: {
                        wedding: {
                            green: '#E3EFE8',
                            greenText: '#4F7A65',
                            pink: '#FDF1F3',
                            pinkText: '#B8727D',
                            bg: '#FCFBFA',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body { overscroll-behavior-y: none; background-color: #F0F2F1; margin: 0; padding: 0; }
        .pb-safe { padding-bottom: env(safe-area-inset-bottom); }
        ::-webkit-scrollbar { width: 0px; background: transparent; }
    </style>
</head>
<body class="flex justify-center h-screen overflow-hidden text-slate-800">
    <div id="root" class="w-full h-full"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // Firebase 專屬設定 (已包含你的 Realtime Database 連結)
        const firebaseConfig = {
            apiKey: "AIzaSyCn8UCLijzEC6TSNAGOGM9DZv_idVZUdas",
            authDomain: "weddingapp-2ac1e.firebaseapp.com",
            databaseURL: "https://weddingapp-2ac1e-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "weddingapp-2ac1e",
            storageBucket: "weddingapp-2ac1e.firebasestorage.app",
            messagingSenderId: "692617114310",
            appId: "1:692617114310:web:d74033eb61a11722fc9dc7"
        };

        const TABLE_CAPACITY = 10; 
        const WEDDING_ID = "wedding-2026-10-03";

        // 初始化 Firebase
        let auth, rtdb;
        try {
            if (!firebase.apps.length) {
                firebase.initializeApp(firebaseConfig);
                auth = firebase.auth();
                rtdb = firebase.database();
            }
        } catch (error) { console.error("Firebase 初始化失敗:", error); }

        const generateDefaultTables = () => {
            const tables = [{ id: '主桌', name: '主桌', type: 'main', capacity: TABLE_CAPACITY }];
            for (let i = 1; i <= 17; i++) {
                tables.push({ id: `第${i}桌`, name: `第 ${i} 桌`, type: 'normal', capacity: TABLE_CAPACITY });
            }
            return tables;
        };

        const generateDefaultGuests = () => {
            const guests = [];
            const tables = generateDefaultTables();
            tables.forEach(table => {
                if (table.id === '主桌') {
                    guests.push({ id: '主桌_新郎', tableId: '主桌', name: '新郎' });
                    guests.push({ id: '主桌_新娘', tableId: '主桌', name: '新娘' });
                    for (let i = 3; i <= 10; i++) {
                        guests.push({ id: `主桌_貴賓${i}`, tableId: '主桌', name: `貴賓 ${i}` });
                    }
                } else {
                    for (let i = 1; i <= 8; i++) {
                        guests.push({ id: `${table.id}_賓客${i}`, tableId: table.id, name: `賓客 ${table.id.replace('第','').replace('桌','')}-${i}` });
                    }
                    guests.push({ id: `${table.id}_預備位1`, tableId: table.id, name: '預備位 1', isSpare: true });
                    guests.push({ id: `${table.id}_預備位2`, tableId: table.id, name: '預備位 2', isSpare: true });
                }
            });
            return guests;
        };

        function App() {
            const [user, setUser] = useState(null);
            const [dynamicData, setDynamicData] = useState({}); 
            const [tables, setTables] = useState(generateDefaultTables());
            const [guests, setGuests] = useState(generateDefaultGuests());
            const [currentView, setCurrentView] = useState('map'); 
            const [selectedTableId, setSelectedTableId] = useState(null);
            const [searchQuery, setSearchQuery] = useState('');
            const [titleClickCount, setTitleClickCount] = useState(0);
            const [showConfigModal, setShowConfigModal] = useState(false);
            const [csvUrl, setCsvUrl] = useState('');
            const [isImporting, setIsImporting] = useState(false);
            const [importMessage, setImportMessage] = useState('');
            const [dbError, setDbError] = useState(!rtdb);

            useEffect(() => {
                if (!auth) return;
                auth.signInAnonymously().catch((error) => { setDbError(true); });
                const unsubscribe = auth.onAuthStateChanged(setUser);
                return () => unsubscribe();
            }, []);

            // 監聽 Realtime Database 資料變動
            useEffect(() => {
                if (!user || !rtdb) return;
                const statusRef = rtdb.ref(`weddings/${WEDDING_ID}/status`);
                
                statusRef.on('value', (snapshot) => {
                    const data = snapshot.val() || {};
                    setDynamicData(data);
                    setDbError(false);
                }, (error) => {
                    console.error("讀取失敗:", error);
                    setDbError(true);
                });

                const configRef = rtdb.ref(`weddings/${WEDDING_ID}/config/layout`);
                configRef.once('value').then((snapshot) => {
                    const data = snapshot.val();
                    if (data && data.tables && data.guests) {
                        setTables(data.tables);
                        setGuests(data.guests);
                        if (data.csvUrl) setCsvUrl(data.csvUrl);
                    }
                });

                return () => statusRef.off();
            }, [user]);

            const toggleStatus = async (guestId, field) => {
                if (!user || !rtdb) { alert("尚未連線到雲端資料庫！"); return; }
                const currentState = dynamicData[guestId]?.[field] || false;
                const newState = !currentState;
                
                setDynamicData(prev => ({
                    ...prev, [guestId]: { ...(prev[guestId] || {}), [field]: newState }
                }));

                try {
                    await rtdb.ref(`weddings/${WEDDING_ID}/status/${guestId}`).update({
                        [field]: newState
                    });
                } catch (error) { console.error("更新失敗:", error); }
            };

            const parseCSV = (text) => {
                const lines = text.split('\n').filter(line => line.trim() !== '');
                const headers = lines[0].split(',').map(h => h.trim());
                const parsedGuests = [];
                const tableSet = new Set();
                const nameIdx = headers.findIndex(h => h.includes('姓名') || h.includes('名字'));
                const tableIdx = headers.findIndex(h => h.includes('桌次') || h.includes('桌號'));
                const noteIdx = headers.findIndex(h => h.includes('備註') || h.includes('屬性'));

                if (nameIdx === -1 || tableIdx === -1) throw new Error('表單必須包含「姓名」與「桌次」欄位');

                for (let i = 1; i < lines.length; i++) {
                    const columns = lines[i].split(',').map(c => c.trim());
                    const name = columns[nameIdx];
                    let tableId = columns[tableIdx];
                    const note = noteIdx !== -1 ? columns[noteIdx] : '';
                    if (!name || !tableId) continue;
                    if (/^\d+$/.test(tableId)) tableId = `第${tableId}桌`;
                    tableSet.add(tableId);
                    const isSpare = note.includes('預備') || name.includes('預備');
                    parsedGuests.push({ id: `${tableId}_${name}`, tableId, name, isSpare, note });
                }

                const parsedTables = Array.from(tableSet).map(t => ({
                    id: t, name: t, type: t.includes('主桌') ? 'main' : 'normal', capacity: TABLE_CAPACITY
                })).sort((a, b) => {
                    if (a.type === 'main') return -1;
                    if (b.type === 'main') return 1;
                    return (parseInt(a.id.replace(/\D/g, '')) || 999) - (parseInt(b.id.replace(/\D/g, '')) || 999);
                });
                return { parsedTables, parsedGuests };
            };

            const handleImport = async () => {
                if (!csvUrl) return setImportMessage('請輸入 CSV 網址');
                setIsImporting(true); setImportMessage('讀取中...');
                try {
                    const response = await fetch(csvUrl);
                    if (!response.ok) throw new Error('無法讀取，請確認網址格式');
                    const csvText = await response.text();
                    const { parsedTables, parsedGuests } = parseCSV(csvText);
                    if (parsedGuests.length === 0) throw new Error('找不到有效的名單資料');
                    setTables(parsedTables); setGuests(parsedGuests);
                    setImportMessage(`準備同步至雲端...`);
                    if (user && rtdb) {
                        await rtdb.ref(`weddings/${WEDDING_ID}/config/layout`).set({
                            tables: parsedTables, guests: parsedGuests, csvUrl, updatedAt: new Date().toISOString()
                        });
                        setImportMessage(`成功載入並同步至所有裝置！`);
                    }
                } catch (error) { setImportMessage(`匯入失敗：${error.message}`); } 
                finally { setIsImporting(false); }
            };

            const handleTitleClick = () => {
                const newCount = titleClickCount + 1;
                setTitleClickCount(newCount);
                if (newCount >= 5) { setShowConfigModal(true); setTitleClickCount(0); }
                setTimeout(() => setTitleClickCount(0), 2000);
            };

            const guestsWithStatus = useMemo(() => {
                return guests.map(guest => ({
                    ...guest,
                    checkedIn: dynamicData[guest.id]?.checkedIn || false,
                    gotGift: dynamicData[guest.id]?.gotGift || false,
                }));
            }, [guests, dynamicData]);

            const tableStats = useMemo(() => {
                const stats = {};
                tables.forEach(t => {
                    const tGuests = guestsWithStatus.filter(g => g.tableId === t.id);
                    stats[t.id] = { total: tGuests.length, checkedIn: tGuests.filter(g => g.checkedIn).length };
                });
                return stats;
            }, [tables, guestsWithStatus]);

            const renderMap = () => {
                const mainTable = tables.find(t => t.type === 'main');
                const normalTables = tables.filter(t => t.type !== 'main');

                return (
                    <div className="p-5 space-y-6 overflow-y-auto h-full pb-28">
                        {dbError && (
                            <div className="bg-red-50/85 border border-red-100 text-red-600 p-4 rounded-2xl text-sm mb-6 flex items-start shadow-sm backdrop-blur-sm">
                                <i className="fa-solid fa-triangle-exclamation mt-0.5 mr-3 text-lg"></i>
                                <div>
                                    <p className="font-semibold tracking-wide">資料庫讀寫受阻</p>
                                    <p className="text-xs mt-1 text-red-500/80">請至 Firebase 「Realtime Database ➔ 規則」將規則設為公開讀寫。</p>
                                </div>
                            </div>
                        )}

                        <div className="text-center mb-6 pt-2">
                            <h2 className="text-lg font-medium text-slate-700 tracking-widest">婚宴桌位分佈</h2>
                            <p className="text-xs text-slate-400 mt-1">共 {tables.length} 桌 / 每桌 {TABLE_CAPACITY} 人</p>
                        </div>
                        
                        <div className="flex flex-col items-center mb-8">
                            <div className="w-48 h-1 bg-slate-200 rounded-full mb-6"></div>
                            
                            {mainTable && (
                                <button onClick={() => { setSelectedTableId(mainTable.id); setCurrentView('table'); }}
                                        className="w-36 h-36 rounded-full bg-wedding-pink border-4 border-white flex flex-col items-center justify-center shadow-[0_8px_30px_rgba(184,114,125,0.15)] active:scale-95 transition-all duration-300 relative group">
                                    <span className="font-medium text-wedding-pinkText text-xl tracking-widest mb-1">{mainTable.name}</span>
                                    <span className="text-xs bg-white/80 backdrop-blur px-3 py-1.5 rounded-full text-wedding-pinkText font-medium">
                                        {tableStats[mainTable.id]?.checkedIn} / {TABLE_CAPACITY}
                                    </span>
                                </button>
                            )}
                        </div>

                        <div className="grid grid-cols-2 gap-4 sm:grid-cols-3">
                            {normalTables.map(table => {
                                const checkedIn = tableStats[table.id]?.checkedIn || 0;
                                const isFull = checkedIn === TABLE_CAPACITY;
                                return (
                                    <button key={table.id}
                                            onClick={() => { setSelectedTableId(table.id); setCurrentView('table'); }}
                                            className={`p-4 rounded-3xl flex flex-col items-center justify-center active:scale-95 transition-all duration-300 min-h-[100px] border-2
                                            ${isFull 
                                                ? 'bg-wedding-green border-white shadow-[0_4px_20px_rgba(79,122,101,0.12)]' 
                                                : 'bg-white border-transparent shadow-[0_4px_20px_rgba(0,0,0,0.03)] hover:shadow-[0_8px_25px_rgba(0,0,0,0.06)]'}`}>
                                        <span className={`font-medium text-base tracking-wider mb-2 ${isFull ? 'text-wedding-greenText' : 'text-slate-600'}`}>
                                            {table.name}
                                        </span>
                                        <span className={`text-[11px] px-3 py-1 rounded-full font-medium ${isFull ? 'bg-white/60 text-wedding-greenText' : 'bg-slate-50 text-slate-400'}`}>
                                            {checkedIn} / {TABLE_CAPACITY}
                                        </span>
                                    </button>
                                )
                            })}
                        </div>
                    </div>
                );
            };

            const renderTableDetail = () => {
                const table = tables.find(t => t.id === selectedTableId);
                const tableGuests = guestsWithStatus.filter(g => g.tableId === selectedTableId);
                const emptySeatsCount = Math.max(0, TABLE_CAPACITY - tableGuests.length);

                return (
                    <div className="flex flex-col h-full bg-wedding-bg">
                        <div className="bg-white/80 backdrop-blur-xl px-5 py-4 flex items-center border-b border-slate-100 sticky top-0 z-10">
                            <button onClick={() => setCurrentView('map')} className="w-10 h-10 -ml-2 rounded-full bg-slate-50 flex items-center justify-center text-slate-400 hover:text-slate-600 transition-colors">
                                <i className="fa-solid fa-arrow-left"></i>
                            </button>
                            <div className="ml-3 flex-1">
                                <h2 className="text-lg font-medium text-slate-700 tracking-wider">{table?.name}</h2>
                                <p className="text-[11px] text-slate-400">已安排 {tableGuests.length} 人</p>
                            </div>
                            <div className="text-xs font-medium bg-wedding-green text-wedding-greenText px-4 py-2 rounded-full shadow-sm">
                                報到 {tableStats[selectedTableId]?.checkedIn} / {TABLE_CAPACITY}
                            </div>
                        </div>
                        
                        <div className="p-5 space-y-4 overflow-y-auto pb-28">
                            {tableGuests.map(guest => (
                                <div key={guest.id} className="bg-white p-4 rounded-3xl shadow-[0_4px_20px_rgba(0,0,0,0.02)] border border-slate-50 flex items-center justify-between">
                                    <div className="flex-1 min-w-0 pr-3">
                                        <h3 className={`font-medium text-[17px] truncate tracking-wide ${guest.isSpare ? 'text-slate-400 italic' : 'text-slate-700'}`}>
                                            {guest.name}
                                        </h3>
                                        {guest.note && <span className="inline-block mt-1.5 px-2 py-0.5 bg-slate-50 text-slate-400 text-[10px] rounded-full truncate max-w-full">{guest.note}</span>}
                                    </div>
                                    <div className="flex gap-2.5 flex-shrink-0">
                                        <button onClick={() => toggleStatus(guest.id, 'checkedIn')}
                                                className={`flex flex-col items-center justify-center w-14 h-[60px] rounded-2xl transition-all duration-300 ${
                                                    guest.checkedIn 
                                                    ? 'bg-wedding-green text-wedding-greenText shadow-inner scale-[0.97]' 
                                                    : 'bg-slate-50 text-slate-300'
                                                }`}>
                                            <i className={`fa-solid fa-check text-lg ${guest.checkedIn ? '' : 'opacity-50'}`}></i>
                                            <span className="text-[10px] mt-1.5 font-medium">{guest.checkedIn ? '已到' : '報到'}</span>
                                        </button>
                                        <button onClick={() => toggleStatus(guest.id, 'gotGift')}
                                                className={`flex flex-col items-center justify-center w-14 h-[60px] rounded-2xl transition-all duration-300 ${
                                                    guest.gotGift 
                                                    ? 'bg-wedding-pink text-wedding-pinkText shadow-inner scale-[0.97]' 
                                                    : 'bg-slate-50 text-slate-300'
                                                }`}>
                                            <i className={`fa-solid fa-gift text-base ${guest.gotGift ? '' : 'opacity-50'}`}></i>
                                            <span className="text-[10px] mt-1.5 font-medium">{guest.gotGift ? '已領' : '喜餅'}</span>
                                        </button>
                                    </div>
                                </div>
                            ))}

                            {Array.from({ length: emptySeatsCount }).map((_, index) => (
                                <div key={`empty-${index}`} className="p-4 rounded-3xl border border-dashed border-slate-200 flex items-center justify-center h-[88px] text-slate-300 bg-transparent">
                                    <span className="font-light text-[13px] tracking-widest">+ 空位</span>
                                </div>
                            ))}
                        </div>
                    </div>
                );
            };

            const renderSearch = () => {
                const results = guestsWithStatus.filter(g => 
                    g.name.toLowerCase().includes(searchQuery.toLowerCase()) && searchQuery.length > 0
                );

                return (
                    <div className="flex flex-col h-full bg-wedding-bg">
                        <div className="bg-white/80 backdrop-blur-xl p-5 border-b border-slate-100 sticky top-0 z-10">
                            <div className="relative">
                                <i className="fa-solid fa-magnifying-glass absolute left-5 top-4 text-slate-300"></i>
                                <input type="text" placeholder="尋找賓客..." value={searchQuery} onChange={(e) => setSearchQuery(e.target.value)}
                                       className="w-full bg-white shadow-sm border border-slate-100 rounded-full py-3.5 pl-12 pr-5 focus:border-wedding-greenText/30 focus:ring-4 focus:ring-wedding-green/30 outline-none text-slate-700 font-medium placeholder-slate-300 transition-all" />
                            </div>
                        </div>
                        
                        <div className="p-5 space-y-3 overflow-y-auto pb-28">
                            {searchQuery === '' ? (
                                <div className="text-center text-slate-300 mt-20 flex flex-col items-center">
                                    <i className="fa-solid fa-seedling text-4xl mb-4 opacity-50"></i>
                                    <p className="font-light tracking-widest text-sm">輸入姓名，優雅帶位</p>
                                </div>
                            ) : results.length === 0 ? (
                                <div className="text-center text-slate-400 mt-10 font-light">找不到名為「{searchQuery}」的賓客</div>
                            ) : (
                                results.map(guest => (
                                    <div key={guest.id} className="bg-white p-4 rounded-3xl shadow-[0_4px_20px_rgba(0,0,0,0.02)] border border-slate-50 flex items-center justify-between">
                                        <div className="flex-1">
                                            <h3 className="font-medium text-slate-700 tracking-wide text-[17px]">{guest.name}</h3>
                                            <p className="text-xs text-slate-400 flex items-center mt-1.5">
                                                <i className="fa-regular fa-map mr-2"></i>
                                                {tables.find(t => t.id === guest.tableId)?.name || guest.tableId}
                                            </p>
                                        </div>
                                        <button onClick={() => { setSelectedTableId(guest.tableId); setCurrentView('table'); }}
                                                className="px-5 py-2.5 bg-slate-50 text-slate-500 font-medium text-sm rounded-full active:scale-95 transition-transform hover:bg-wedding-green hover:text-wedding-greenText">
                                            查看
                                        </button>
                                    </div>
                                ))
                            )}
                        </div>
                    </div>
                );
            };

            return (
                <div className="w-full max-w-md mx-auto bg-wedding-bg h-full flex flex-col relative shadow-[0_0_50px_rgba(0,0,0,0.05)] overflow-hidden">
                    <header className="bg-white/80 backdrop-blur-xl px-5 py-4 flex items-center justify-between z-20 shadow-[0_4px_20px_rgba(0,0,0,0.02)]">
                        <div className="flex flex-col">
                            <h1 className="text-[17px] font-medium text-slate-700 select-none cursor-pointer tracking-widest" onClick={handleTitleClick}>
                                座位管理系統
                            </h1>
                            <span className="text-[10px] font-light mt-1 flex items-center text-slate-400">
                                {dbError ? <><span className="w-1.5 h-1.5 rounded-full bg-slate-300 mr-1.5"></span>離線模式</> :
                                 user ? <><span className="w-1.5 h-1.5 rounded-full bg-wedding-greenText/50 mr-1.5 animate-pulse"></span>雲端同步中</> : 
                                 '連線中...'}
                            </span>
                        </div>
                        <div className="bg-slate-50 text-slate-400 px-3 py-1.5 rounded-full text-[10px] font-medium tracking-widest border border-slate-100">
                            18 桌
                        </div>
                    </header>

                    <main className="flex-1 overflow-hidden relative">
                        {currentView === 'map' && renderMap()}
                        {currentView === 'table' && renderTableDetail()}
                        {currentView === 'search' && renderSearch()}
                    </main>

                    <nav className="absolute bottom-5 left-5 right-5 bg-white/90 backdrop-blur-xl rounded-full shadow-[0_10px_40px_rgba(0,0,0,0.08)] flex justify-around p-2 z-20 border border-white/50">
                        <button onClick={() => setCurrentView('map')} className={`flex-1 flex flex-col items-center py-2.5 rounded-full transition-all duration-300 ${currentView === 'map' || currentView === 'table' ? 'bg-wedding-green text-wedding-greenText' : 'text-slate-400'}`}>
                            <i className="fa-solid fa-layer-group text-lg"></i>
                            <span className="text-[10px] mt-1 font-medium tracking-widest">座位</span>
                        </button>
                        <button onClick={() => setCurrentView('search')} className={`flex-1 flex flex-col items-center py-2.5 rounded-full transition-all duration-300 ${currentView === 'search' ? 'bg-wedding-pink text-wedding-pinkText' : 'text-slate-400'}`}>
                            <i className="fa-solid fa-search text-lg"></i>
                            <span className="text-[10px] mt-1 font-medium tracking-widest">尋找</span>
                        </button>
                    </nav>

                    {showConfigModal && (
                        <div className="absolute inset-0 bg-slate-900/20 z-50 flex items-center justify-center p-5 backdrop-blur-md transition-opacity">
                            <div className="bg-white rounded-[2rem] w-full max-w-sm shadow-2xl overflow-hidden">
                                <div className="px-6 py-5 border-b border-slate-50 flex justify-between items-center">
                                    <h3 className="text-base font-medium text-slate-700 tracking-wider">
                                        系統設定
                                    </h3>
                                    <button onClick={() => setShowConfigModal(false)} className="w-8 h-8 flex items-center justify-center rounded-full bg-slate-50 text-slate-400 hover:bg-slate-100 transition-colors">
                                        <i className="fa-solid fa-xmark"></i>
                                    </button>
                                </div>
                                
                                <div className="p-6 max-h-[70vh] overflow-y-auto">
                                    <div className="space-y-4">
                                        <h4 className="font-medium text-slate-600 text-sm tracking-wide">
                                            雲端匯入 (CSV)
                                        </h4>
                                        <input type="url" placeholder="https://docs.google.com/..." value={csvUrl} onChange={(e) => setCsvUrl(e.target.value)}
                                               className="w-full bg-slate-50 border-none rounded-2xl p-4 text-sm focus:ring-4 focus:ring-wedding-green/30 outline-none text-slate-600 placeholder-slate-300 transition-all" />
                                        <button onClick={handleImport} disabled={isImporting || dbError}
                                                className="w-full bg-slate-800 text-white font-medium tracking-widest py-4 rounded-2xl active:scale-95 transition-transform disabled:bg-slate-200 disabled:text-slate-400">
                                            {isImporting ? '處理中...' : '匯入名單'}
                                        </button>
                                        {importMessage && (
                                            <div className={`p-4 rounded-2xl text-xs font-medium text-center tracking-wide ${importMessage.includes('失敗') ? 'bg-red-50 text-red-500' : 'bg-wedding-green text-wedding-greenText'}`}>
                                                {importMessage}
                                            </div>
                                        )}
                                        {dbError && <p className="text-[11px] text-red-400 text-center">請確認 Realtime Database 規則已設定為公開</p>}
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
